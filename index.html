<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5a61">
<meta name="mobile-web-app-capable" content="yes">
<title>10-Days</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Layout: consolă de mână — un singur lucru pe ecran. Depozitul activ colorează bara de sus, operațiunea colorează panoul de scanare. */
:root{
  --bg:#e8ebe7; --surface:#ffffff; --surface2:#f2f5f1; --ink:#12181a; --muted:#566165; --line:#c7cfca;
  --in:#156b37; --in-ink:#11592d; --in-t:#dcf0e3;
  --out:#b3261e; --out-ink:#9c1f18; --out-t:#fbe3e0;
  --move:#1b57b0; --move-ink:#184c9a; --move-t:#dfe9fa;
  --check:#37474c; --check-ink:#2c3a3e; --check-t:#e1e7e8;
  --warn-ink:#7a4f00; --warn-t:#fcefc9; --warn-line:#e2c267;
  --wh0:#0b5a61; --wh1:#6a2c79; --wh2:#7a4a10; --wh3:#34444b;
  --on-solid:#ffffff; --shade:rgba(10,16,18,.55); --dot-ok:#7fe3a4; --dot-warn:#ffd166; --dot-bad:#ff9d94;
  --f-ui:"Roboto Condensed","sans-serif-condensed","Arial Narrow","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-code:"Roboto Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1213; --surface:#181d1f; --surface2:#1f2629; --ink:#e8eeee; --muted:#9ba8ab; --line:#313b3e;
  --in:#1b7d41; --in-ink:#6bd596; --in-t:#12301e;
  --out:#b93229; --out-ink:#ff8a7f; --out-t:#3a1815;
  --move:#2562c2; --move-ink:#86b3ff; --move-t:#15284a;
  --check:#44565c; --check-ink:#b9c6c9; --check-t:#232b2e;
  --warn-ink:#f2c860; --warn-t:#33290d; --warn-line:#6e5a1c;
  --wh0:#0b5a61; --wh1:#6a2c79; --wh2:#7a4a10; --wh3:#34444b;
  --on-solid:#ffffff; --shade:rgba(0,0,0,.66); --dot-ok:#7fe3a4; --dot-warn:#ffd166; --dot-bad:#ff9d94; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1213; --surface:#181d1f; --surface2:#1f2629; --ink:#e8eeee; --muted:#9ba8ab; --line:#313b3e;
  --in:#1b7d41; --in-ink:#6bd596; --in-t:#12301e;
  --out:#b93229; --out-ink:#ff8a7f; --out-t:#3a1815;
  --move:#2562c2; --move-ink:#86b3ff; --move-t:#15284a;
  --check:#44565c; --check-ink:#b9c6c9; --check-t:#232b2e;
  --warn-ink:#f2c860; --warn-t:#33290d; --warn-line:#6e5a1c;
  --wh0:#0b5a61; --wh1:#6a2c79; --wh2:#7a4a10; --wh3:#34444b;
  --on-solid:#ffffff; --shade:rgba(0,0,0,.66); --dot-ok:#7fe3a4; --dot-warn:#ffd166; --dot-bad:#ff9d94; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;touch-action:manipulation;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--move-ink);outline-offset:1px}
h2{font-family:var(--f-ui);font-size:20px;font-weight:700;margin:0 0 10px;letter-spacing:.01em}
h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.code{font-family:var(--f-code);font-variant-numeric:tabular-nums;letter-spacing:-.01em;word-break:break-all}
.code b{font-weight:700}
.code.nb{white-space:nowrap;word-break:normal}
.nowrap{white-space:nowrap}

/* ---- cadru ---- */
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "nav"}
#top{grid-area:top;background:var(--wh0);color:var(--on-solid);display:flex;align-items:center;justify-content:space-between;padding:6px 16px;min-height:50px}
#app[data-wh="1"] #top{background:var(--wh1)} #app[data-wh="2"] #top{background:var(--wh2)} #app[data-wh="3"] #top{background:var(--wh3)}
#whBtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:var(--on-solid);border-radius:6px;padding:3px 30px 3px 10px;text-align:left;position:relative;min-height:38px;font-family:var(--f-ui)}
#whBtn .lbl{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.85;line-height:1.1}
#whBtn b{display:block;font-size:19px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em}
#whBtn::after{content:"";position:absolute;right:11px;top:50%;margin-top:-2px;border:5px solid transparent;border-top-color:var(--on-solid)}
#topInfo{text-align:right;font-family:var(--f-ui);font-size:12px;line-height:1.25;opacity:.95;margin-left:10px;min-width:0}
#topInfo .bad{background:var(--out);color:var(--on-solid);padding:1px 6px;border-radius:3px;font-weight:700}
#main{grid-area:main;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-width:0}
#nav{grid-area:nav;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{background:none;border:0;border-top:3px solid transparent;padding:5px 1px 6px;font-family:var(--f-ui);font-size:11px;color:var(--muted);position:relative;min-height:50px}
#nav svg{display:block;margin:0 auto 1px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink);font-weight:700}
#nav .dot{position:absolute;top:5px;left:50%;margin-left:9px;width:9px;height:9px;border-radius:50%;background:var(--out)}
.tab{padding:12px 16px 28px;max-width:1240px}
#tab-scan{max-width:580px}
@media (min-width:900px){
  #app{grid-template-columns:190px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "nav main"}
  #nav{grid-template-columns:minmax(0,1fr);align-content:start;border-top:0;border-right:1px solid var(--line);padding:10px 0}
  #nav button{display:flex;align-items:center;border-top:0;border-left:4px solid transparent;padding:10px 14px;font-size:15px;min-height:44px;text-align:left}
  #nav svg{margin:0 10px 0 0}
  #nav button[aria-current="page"]{border-left-color:var(--ink);background:var(--surface2)}
  #nav .dot{left:auto;right:14px;top:50%;margin:-4px 0 0}
  .tab{padding:18px 24px 40px}
}

/* ---- scanare ---- */
#modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:5px;margin-bottom:8px}
#modes button{font-family:var(--f-ui);font-size:15px;font-weight:700;letter-spacing:.02em;padding:9px 2px;border-radius:6px;border:2px solid var(--line);background:var(--surface);color:var(--muted);min-height:44px}
#modes button[data-mode="IN"][aria-pressed="true"]{background:var(--in);border-color:var(--in);color:var(--on-solid)}
#modes button[data-mode="OUT"][aria-pressed="true"]{background:var(--out);border-color:var(--out);color:var(--on-solid)}
#modes button[data-mode="MOVE"][aria-pressed="true"]{background:var(--move);border-color:var(--move);color:var(--on-solid)}
#modes button[data-mode="CHECK"][aria-pressed="true"]{background:var(--check);border-color:var(--check);color:var(--on-solid)}
#panel{border-radius:8px;color:var(--on-solid);padding:10px 12px 12px;background:var(--in);position:relative}
#panel[data-mode="OUT"],#panel[data-mode="PICK"]{background:var(--out)} #panel[data-mode="MOVE"]{background:var(--move)} #panel[data-mode="CHECK"]{background:var(--check)}
#panelHead{font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;padding-right:70px}
#ask{font-family:var(--f-ui);font-size:25px;font-weight:700;line-height:1.12;margin-top:6px}
#slots{margin-top:8px}
.slot{display:grid;grid-template-columns:74px minmax(0,1fr);align-items:baseline;padding:5px 8px;border-radius:5px;background:rgba(0,0,0,.18);margin-top:4px;min-height:32px}
.slot .k{font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.slot .v{font-family:var(--f-code);font-size:15px;word-break:break-all}
.slot .v small{display:block;font-family:var(--f-ui);font-size:12px;opacity:.9}
.slot.next{background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.slot.next .v{font-family:var(--f-ui);font-style:italic;opacity:.95}
#panel .mini{position:absolute;top:7px;right:8px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.5);color:var(--on-solid);border-radius:5px;font-family:var(--f-ui);font-size:13px;padding:4px 9px;min-height:30px}
.outbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px;font-family:var(--f-ui);font-size:14px}
.outbar button{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.5);color:var(--on-solid);border-radius:5px;font-size:13px;padding:3px 9px;margin-left:6px;min-height:30px}
.outbar b{font-size:17px}
#scanForm{display:grid;grid-template-columns:minmax(0,1fr) 46px 62px;grid-gap:6px;margin:8px 0}
#scanInput{min-width:0;height:46px;border:2px solid var(--ink);border-radius:6px;background:var(--surface);padding:0 10px;font-family:var(--f-code);font-size:17px}
#scanInput::placeholder{font-family:var(--f-ui);font-size:14px;color:var(--muted)}
#scanForm button{height:46px;border-radius:6px;border:2px solid var(--ink);background:var(--surface);font-family:var(--f-ui);font-weight:700;font-size:16px;padding:0}
#scanForm #okBtn{background:var(--ink);color:var(--surface)}
#kbBtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;vertical-align:middle}
#kbBtn[aria-pressed="true"]{background:var(--warn-t);border-color:var(--warn-ink);color:var(--warn-ink)}
#result:empty{display:none}
.res{border-radius:8px;padding:10px 12px;border:2px solid var(--line);background:var(--surface);margin-bottom:10px}
.res .t{font-family:var(--f-ui);font-weight:700;font-size:18px;line-height:1.15}
.res .d{margin-top:3px;font-size:14px}
.res .d .code{font-size:15px}
.res.ok{border-color:var(--in-ink);background:var(--in-t)} .res.ok .t{color:var(--in-ink)}
.res.bad{border-color:var(--out-ink);background:var(--out-t)} .res.bad .t{color:var(--out-ink)}
.res.warn,.res.ask{border-color:var(--warn-line);background:var(--warn-t)} .res.warn .t,.res.ask .t{color:var(--warn-ink)}
.res .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:8px;margin-top:10px}
.res .acts.one{grid-template-columns:minmax(0,1fr)}
.pill{display:inline-block;font-family:var(--f-ui);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;border-radius:4px;padding:2px 7px;line-height:1.35;white-space:nowrap}
.pill.IN,.pill.free{background:var(--in-t);color:var(--in-ink)} .pill.OUT,.pill.conf{background:var(--out-t);color:var(--out-ink)}
.pill.MOVE,.pill.occ{background:var(--move-t);color:var(--move-ink)} .pill.UNLOC{background:var(--warn-t);color:var(--warn-ink)} .pill.VOID{background:var(--check-t);color:var(--check-ink)}
.pill.big{font-size:17px;padding:4px 12px}
.info .big-code{font-family:var(--f-code);font-size:21px;font-weight:700;word-break:break-all;line-height:1.15;margin:2px 0 6px}
.info .row{padding:7px 0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.info .row>div{min-width:0}
.info .row button{margin-left:8px;flex:none}
@keyframes flashbad{0%,60%{box-shadow:inset 0 0 0 600px rgba(179,38,30,.35)}100%{box-shadow:inset 0 0 0 600px rgba(179,38,30,0)}}
#tab-scan.flash{animation:flashbad .7s ease-out}
@media (prefers-reduced-motion:reduce){#tab-scan.flash{animation:none;outline:4px solid var(--out);outline-offset:-4px}}
.sec-h{font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.rec .code{font-size:13px}
.rec .w{color:var(--muted);font-family:var(--f-ui)}
.rec.void{opacity:.55;text-decoration:line-through}

/* ---- butoane și formulare ---- */
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:6px;padding:8px 14px;font-family:var(--f-ui);font-weight:700;font-size:15px;min-height:42px;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--surface)}
.btn.danger{border-color:var(--out-ink);color:var(--out-ink)}
.btn.danger.pri{background:var(--out);border-color:var(--out);color:var(--on-solid)}
.btn.sm{padding:3px 10px;min-height:32px;font-size:13px;border-width:1px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;margin:-4px}
.btns>*{margin:4px}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.inp{width:100%;min-width:0;height:40px;border:1px solid var(--muted);border-radius:6px;background:var(--surface);padding:0 10px}
select.inp{padding-right:4px}
.chk{display:flex;align-items:center;padding:7px 0;min-height:40px}
.chk input{width:22px;height:22px;margin:0 10px 0 0;flex:none}

/* ---- pagini de date ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));grid-gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--wh3);border-radius:6px;padding:8px 10px}
.kpi[data-wh="0"]{border-left-color:var(--wh0)} .kpi[data-wh="1"]{border-left-color:var(--wh1)} .kpi[data-wh="2"]{border-left-color:var(--wh2)}
.kpi.alert{border-left-color:var(--out)}
.kpi .n{font-family:var(--f-ui);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));grid-gap:8px;align-items:end;margin-bottom:10px}
.bar .fld{margin:0}
.bar .grow{grid-column:span 2}
@media (max-width:420px){.bar .grow{grid-column:auto}}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--ink);border-radius:6px;overflow:hidden;height:40px}
.seg button{border:0;background:var(--surface);font-family:var(--f-ui);font-weight:700;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-ui);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--surface2)}
th[data-sort]{cursor:pointer}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .code{font-size:13.5px}
tr.void td{color:var(--muted)} tr.void td.sx{text-decoration:line-through}
td.act{text-align:right;white-space:nowrap}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.count{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin:8px 2px}
@media (max-width:700px){.hide-sm{display:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card p{max-width:68ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));grid-gap:12px;align-items:start}
.cards .card{margin:0}
.note{background:var(--warn-t);border:1px solid var(--warn-line);color:var(--ink);border-radius:6px;padding:9px 12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note>span{margin:2px 8px 2px 0}
.list{margin:0 0 8px;padding:0;list-style:none}
.list li{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-gap:6px}
.st-ok{color:var(--in-ink);font-weight:700} .st-warn{color:var(--warn-ink);font-weight:700} .st-err{color:var(--out-ink);font-weight:700} .st-dup{color:var(--muted);font-weight:700}

/* ---- ferestre ---- */
#dlg{position:fixed;left:0;top:0;right:0;bottom:0;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;z-index:20}
.dbox{background:var(--surface);color:var(--ink);border-radius:10px;width:100%;max-width:520px;margin:auto 0;padding:16px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dbox.wide{max-width:980px}
.dbox h2{padding-right:44px}
.dbox .x{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:none;font-size:26px;line-height:1;color:var(--muted);border-radius:6px}
.dbox .foot{margin-top:14px;display:flex;justify-content:flex-end;flex-wrap:wrap}
.dbox .foot>*{margin:4px 0 4px 8px}
.whpick{display:grid;grid-gap:8px;margin:10px 0}
.whpick button{border:0;border-radius:8px;color:var(--on-solid);background:var(--wh3);font-family:var(--f-ui);font-size:22px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:14px;text-align:left;min-height:58px}
.whpick button[data-i="0"]{background:var(--wh0)} .whpick button[data-i="1"]{background:var(--wh1)} .whpick button[data-i="2"]{background:var(--wh2)}
.whpick button small{display:block;font-size:12px;font-weight:400;letter-spacing:.06em;opacity:.9}
#toast{position:fixed;left:16px;right:16px;bottom:72px;z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast>div{background:var(--ink);color:var(--surface);border-radius:8px;padding:10px 14px;font-size:14px;max-width:520px;pointer-events:auto;display:flex;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast button{margin-left:12px;background:none;border:1px solid currentColor;color:inherit;border-radius:5px;padding:4px 10px;font-family:var(--f-ui);font-weight:700}

/* ---- liste pe ecran îngust ---- */
.res .th{display:flex;align-items:center;justify-content:space-between}
.res .th .btn{margin-left:8px;flex:none}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-gap:2px 8px;align-items:center;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:9px 10px;font-size:13.5px}
.lrow:last-child,.mrow:last-child{border-bottom:0}
.lrow .c{grid-column:1/-1;color:var(--muted);font-family:var(--f-ui);font-size:12.5px}
.lrow .c .btn{margin:3px 0}
.mrow{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.mrow .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;min-height:32px}
.mrow .w{color:var(--muted);font-family:var(--f-ui);font-size:12.5px}
.mrow.void .sx{text-decoration:line-through;color:var(--muted)}
@media (max-width:700px){.bar .btns{grid-column:1/-1}}
/* ---- scanner: ecran mic, totul trebuie să încapă fără derulare ---- */
@media (max-width:480px){
  #top{min-height:44px;padding:4px 16px}
  #whBtn{min-height:34px;padding-top:2px;padding-bottom:2px} #whBtn b{font-size:17px}
  .tab{padding:8px 16px 20px}
  #modes{margin-bottom:6px} #modes button{min-height:40px;padding:6px 1px;font-size:14px}
  #panel{padding:8px 10px 10px} #ask{font-size:22px;margin-top:3px}
  .slot{min-height:30px;padding:4px 8px}
  #scanForm{margin:6px 0} #scanInput,#scanForm button{height:44px}
  #nav button{min-height:46px;padding-top:3px;padding-bottom:4px}
  .res{padding:8px 10px;margin-bottom:8px}
}

.more{display:contents}
.only-sm{display:none}
@media (max-width:700px){
  .only-sm{display:block;grid-column:1/-1}
  .more{display:none}
  .more.open{display:grid;grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:8px;align-items:end}
  .more .btns{grid-column:1/-1}
  .bar .grow{grid-column:1/-1}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:8px}
  .kpi{padding:6px 10px} .kpi .n{font-size:24px}
}

/* ---- starea sincronizării, în bara de sus ---- */
#topInfo[data-act]{cursor:pointer}
.sy{white-space:nowrap}
.sy::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--dot-warn);vertical-align:baseline}
.sy.ok::before{background:var(--dot-ok)} .sy.bad::before{background:var(--dot-bad)}

/* ---- parter: confirmarea paleților; comenzi ---- */
#nav .badge{position:absolute;top:4px;left:50%;margin-left:6px;min-width:16px;height:16px;border-radius:8px;background:var(--out);color:var(--on-solid);font-size:10px;font-weight:700;line-height:16px;padding:0 4px}
@media (min-width:900px){#nav .badge{left:auto;right:12px;top:50%;margin:-8px 0 0}}
.vhead{font-family:var(--f-ui);font-size:13px;opacity:.95;margin-bottom:4px}
.slot .vrow{display:flex;align-items:center;justify-content:space-between;min-width:0}
.slot.next .v.vrow{font-style:normal;opacity:1}
.vrow .code{font-size:13px;white-space:normal;word-break:break-all}
.slot .vb{background:var(--out);border:1px solid rgba(255,255,255,.6);color:var(--on-solid);border-radius:5px;font-family:var(--f-ui);font-weight:700;font-size:12px;padding:3px 9px;margin-left:8px;min-height:28px;flex:none}
.rec.dim{opacity:.6}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr);grid-gap:2px 10px;align-items:baseline;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--move);border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.orow b{font-family:var(--f-ui);font-size:17px}
.orow .c{grid-column:1/-1;color:var(--muted);font-family:var(--f-ui);font-size:12.5px}

</style>

<body>

  <header id="top">

  <nav id="nav" aria-label="Secțiuni">
    <button type="button" data-tab="scan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6v12M8 6v12M11 6v12M15 6v12M18 6v12M20.5 6v12"/></svg>Scanare</button>
    <button type="button" data-tab="stock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20v-6h6v6M13 20v-6h6v6M9 14V8h6v6"/></svg>Stoc</button>
    <button type="button" data-tab="moves"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>Mișcări</button>
    <button type="button" data-tab="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v15H5zM9 3v4M15 3v4M8 11l2 2 4-4M8 16h8"/></svg>Comenzi<span class="badge" id="ordBadge" hidden></span></button>
    <button type="button" data-tab="data"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 18h14"/></svg>Date<span class="dot" id="dataDot" hidden></span></button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h3M11 12h9M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>Setări</button>
  </nav>
  <main id="main">
    <section id="tab-scan" class="tab">
      <div id="modes">
        <button type="button" data-mode="IN" aria-pressed="true">Intrare</button>
        <button type="button" data-mode="OUT" aria-pressed="false">Ieșire</button>
        <button type="button" data-mode="MOVE" aria-pressed="false">Mutare</button>
        <button type="button" data-mode="CHECK" aria-pressed="false">Verifică</button>
      </div>

        <div id="panelHead"></div>
        <div id="ask"></div>

      </div>
      <form id="scanForm" autocomplete="off">
        <input id="scanInput" type="text" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" placeholder="cod scanat sau tastat" aria-label="Cod scanat">
        <button type="button" id="kbBtn" data-act="kb" aria-pressed="false" title="Tastatură pe ecran"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h0M11 10h0M15 10h0M8 14h8"/></svg></button>
        <button type="submit" id="okBtn">OK</button>
      </form>
      <div id="result" aria-live="assertive"></div>
      <div id="recent"></div>
    </section>
    <section id="tab-stock" class="tab" hidden></section>
    <section id="tab-moves" class="tab" hidden></section>
    <section id="tab-orders" class="tab" hidden></section>

    <section id="tab-settings" class="tab" hidden></section>
  </main>
</div>
<div id="dlg" hidden></div>
<div id="toast" hidden></div>

<script src="config.js"></script>
<script>
/* Stoc Paleți — logica de bază (fără interfață). Rulează identic în browser și în Node (teste). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.StocCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var GS = '\x1d';
  var TYPE_LABEL = { IN: 'Intrare', OUT: 'Ieșire', MOVE: 'Mutare', UNLOC: 'Fără locație', VOID: 'Anulare', PICKMISS: 'Negăsit la comandă' };
  var LOST = 'LOST';
  var SRC_LABEL = { scan: 'Scanare', manual: 'Manual', import: 'Import', demo: 'Demo' };

  /* ---------- utilitare ---------- */
  function pad(n, w) { var s = String(n); while (s.length < (w || 2)) s = '0' + s; return s; }
  function fmtD(ts) { var d = new Date(ts); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); }
  function fmtT(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function fmtDT(ts) { return fmtD(ts) + ' ' + fmtT(ts); }
  function stamp(ts) { var d = new Date(ts); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()); }
  function lkey(wh, loc) { return wh + '\u0001' + loc; }
  function fold(s) { // minuscule, fără diacritice, doar litere/cifre — pentru potrivirea antetelor
    return String(s == null ? '' : s).toLowerCase()
      .replace(/[ăâ]/g, 'a').replace(/î/g, 'i').replace(/[șş]/g, 's').replace(/[țţ]/g, 't')
      .replace(/[^a-z0-9]/g, '');
  }
  function cleanRaw(raw) { // păstrează GS (separator GS1), elimină restul caracterelor de control
    return String(raw == null ? '' : raw).replace(/[\x00-\x1c\x1e\x1f\x7f]/g, '').trim();
  }
  function normLoc(raw) { return cleanRaw(raw).replace(/\x1d/g, '').replace(/^\][A-Za-z][0-9A-Za-z]/, '').trim().toUpperCase(); }

  /* ---------- GS1 ---------- */
  function aiSpec(s, pos) {
    var a2 = s.substr(pos, 2), a3 = s.substr(pos, 3), a4 = s.substr(pos, 4);
    if (!/^\d\d/.test(a2)) return null;
    switch (a2) {
      case '00': return { ai: a2, fix: 18, num: true };
      case '01': case '02': return { ai: a2, fix: 14, num: true };
      case '11': case '12': case '13': case '15': case '16': case '17': return { ai: a2, fix: 6, num: true };
      case '20': return { ai: a2, fix: 2, num: true };
      case '10': case '21': case '22': return { ai: a2, max: 20 };
      case '30': case '37': return { ai: a2, max: 8, num: true };
    }
    if (/^9\d$/.test(a2)) return { ai: a2, max: a2 === '90' ? 30 : 90 };
    if (/^3[1-6]\d\d$/.test(a4)) return { ai: a4, fix: 6, num: true };
    if (/^39[0-3]\d$/.test(a4)) return { ai: a4, max: 18, num: true };
    if (/^24[0-3]$/.test(a3) || /^25[01]$/.test(a3)) return { ai: a3, max: 30 };
    if (/^40[013]$/.test(a3)) return { ai: a3, max: 30 };
    if (a3 === '402') return { ai: a3, fix: 17, num: true };
    if (/^41[0-7]$/.test(a3)) return { ai: a3, fix: 13, num: true };
    if (/^42[0-7]$/.test(a3)) return { ai: a3, max: 20 };
    return null;
  }
  function parseElements(s, pos, depth) {
    while (s.charAt(pos) === GS) pos++;
    if (pos >= s.length) return [];
    if (depth > 12) return null;
    var sp = aiSpec(s, pos);
    if (!sp) return null;
    var start = pos + sp.ai.length, val, rest;
    if (sp.fix) {
      val = s.substr(start, sp.fix);
      if (val.length !== sp.fix || !/^\d+$/.test(val)) return null;
      rest = parseElements(s, start + sp.fix, depth + 1);
      return rest ? [{ ai: sp.ai, val: val }].concat(rest) : null;
    }
    var gs = s.indexOf(GS, start);
    if (gs >= 0) {
      val = s.slice(start, gs);
      if (!val || val.length > sp.max || (sp.num && !/^\d+$/.test(val))) return null;
      rest = parseElements(s, gs + 1, depth + 1);
      return rest ? [{ ai: sp.ai, val: val }].concat(rest) : null;
    }
    // fără separator: câmpul variabil ia cât poate; se împarte doar dacă altfel nu se potrivește
    var maxLen = Math.min(sp.max, s.length - start);
    for (var L = maxLen; L >= 1; L--) {
      val = s.substr(start, L);
      if (sp.num && !/^\d+$/.test(val)) continue;
      rest = parseElements(s, start + L, depth + 1);
      if (rest) return [{ ai: sp.ai, val: val }].concat(rest);
    }
    return null;
  }
  function gs1Date(v) { // AALLZZ → zz.ll.aaaa (ziua 00 = ultima zi din lună, o lăsăm ca atare)
    if (!/^\d{6}$/.test(v)) return v;
    var yy = +v.substr(0, 2);
    return v.substr(4, 2) + '.' + v.substr(2, 2) + '.' + (yy >= 70 ? 1900 + yy : 2000 + yy);
  }
  function parseGS1(raw, implicit) {
    var s = cleanRaw(raw), explicit = false, els = null, m;
    if (/^\](C1|e0|d2|Q3|J1)/.test(s)) { explicit = true; s = s.slice(3); }
    if (/^\(\d{2,4}\)/.test(s)) {
      els = []; var re = /\((\d{2,4})\)([^(]*)/g;
      while ((m = re.exec(s))) els.push({ ai: m[1], val: m[2].replace(/\x1d/g, '').trim() });
    } else if (explicit || s.indexOf(GS) >= 0 || implicit) {
      els = parseElements(s, 0, 0);
    }
    if (!els || !els.length) return null;
    var out = { els: els };
    els.forEach(function (e) {
      if (e.ai === '00' && /^\d{18}$/.test(e.val)) out.sscc = e.val;
      else if (e.ai === '01' || e.ai === '02') out.gtin = e.val;
      else if (e.ai === '10') out.lot = e.val;
      else if (e.ai === '15' || e.ai === '17') out.exp = gs1Date(e.val);
      else if (e.ai === '11') out.prod = gs1Date(e.val);
      else if (e.ai === '37' || e.ai === '30') out.qty = e.val;
      else if (e.ai === '21') out.serial = e.val;
    });
    return out;
  }
  function gs1Info(g) { // doar câmpurile utile, pentru salvare pe mișcare
    if (!g) return null;
    var o = {}, n = 0;
    ['gtin', 'lot', 'exp', 'prod', 'qty', 'serial'].forEach(function (k) { if (g[k]) { o[k] = g[k]; n++; } });
    return n ? o : null;
  }

  /* Interpretează orice cod scanat. Nu respinge nimic: dacă nu e SSCC, codul întreg devine identificatorul. */
  function parseScan(raw) {
    var s = cleanRaw(raw);
    if (!s) return null;
    var body = s.replace(/^\][A-Za-z][0-9A-Za-z]/, '');
    var plain = body.replace(/\x1d/g, '').trim();
    if (!plain) return null;
    var looksGs1 = /^\](C1|e0|d2|Q3|J1)/.test(s) || /^\(\d{2,4}\)/.test(body) || body.indexOf(GS) >= 0;
    var g = null;
    if (looksGs1) g = parseGS1(s, false);
    else if (/^\d{20}$/.test(plain) && plain.substr(0, 2) === '00') g = parseGS1(plain, true);
    else if (plain.length >= 18 && /^0[012]\d/.test(plain) && !/^\d{18}$/.test(plain)) g = parseGS1(plain, true);
    var id, isSSCC = false;
    if (g && g.sscc) { id = g.sscc; isSSCC = true; }
    else if (/^\d{18}$/.test(plain)) { id = plain; isSSCC = true; }
    else id = plain.toUpperCase();
    if (id.length > 120) id = id.slice(0, 120);
    return { raw: s, id: id, loc: plain.toUpperCase(), isSSCC: isSSCC, gs1: gs1Info(g) };
  }

  /* ---------- starea stocului, derivată din jurnalul de mișcări ---------- */
  function sortEvents(evs) {
    evs.sort(function (a, b) { return a.ts - b.ts || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0); });
    return evs;
  }
  function newState() {
    return { stock: new Map(), byLoc: new Map(), lastEv: new Map(), voided: new Set(), locNames: new Set(), locKeys: new Set(), maxTs: 0 };
  }
  function addLoc(st, wh, loc, p) {
    if (!loc) return;
    var k = lkey(wh, loc), set = st.byLoc.get(k);
    if (!set) { set = new Set(); st.byLoc.set(k, set); }
    set.add(p);
  }
  function delLoc(st, wh, loc, p) {
    if (!loc) return;
    var k = lkey(wh, loc), set = st.byLoc.get(k);
    if (set) { set.delete(p); if (!set.size) st.byLoc.delete(k); }
  }
  function noteLoc(st, wh, loc) { if (loc) { st.locNames.add(loc); st.locKeys.add(lkey(wh, loc)); } }
  function applyEvent(st, e) {
    if (e.ts > st.maxTs) st.maxTs = e.ts;
    if (e.type === 'VOID' || e.type === 'PICKMISS' || !e.p) return;
    var cur = st.stock.get(e.p);
    if (e.type === 'IN' || e.type === 'MOVE') {
      if (cur) { delLoc(st, cur.wh, cur.loc, e.p); cur.wh = e.wh; cur.loc = e.loc || ''; cur.lastTs = e.ts; cur.lastType = e.type; }
      else { cur = { p: e.p, wh: e.wh, loc: e.loc || '', inTs: e.ts, lastTs: e.ts, lastType: e.type, gs1: null }; st.stock.set(e.p, cur); }
      if (e.gs1) cur.gs1 = e.gs1;
      addLoc(st, cur.wh, cur.loc, e.p);
      noteLoc(st, e.wh, e.loc);
    } else if (e.type === 'OUT') {
      if (cur) { delLoc(st, cur.wh, cur.loc, e.p); st.stock.delete(e.p); }
    } else if (e.type === 'UNLOC') {
      if (cur && cur.wh === e.wh && cur.loc === e.loc) { delLoc(st, cur.wh, cur.loc, e.p); cur.loc = ''; cur.lastTs = e.ts; cur.lastType = 'UNLOC'; }
    }
    st.lastEv.set(e.p, e);
  }
  /* events trebuie să fie sortate (sortEvents). masterLocs: [{wh, loc}] — lista opțională de locații. */
  function computeState(events, masterLocs) {
    var st = newState(), i;
    for (i = 0; i < events.length; i++) if (events[i].type === 'VOID' && events[i].ref) st.voided.add(events[i].ref);
    for (i = 0; i < events.length; i++) if (!st.voided.has(events[i].id)) applyEvent(st, events[i]);
    (masterLocs || []).forEach(function (m) { noteLoc(st, m.wh, m.loc); });
    return st;
  }
  function occupants(st, wh, loc) {
    var set = st.byLoc.get(lkey(wh, loc));
    return set ? Array.from(set) : [];
  }
  function classify(st, parsed) {
    if (parsed.isSSCC) return 'pallet';
    if (st.stock.has(parsed.id)) return 'pallet';
    if (st.locNames.has(parsed.loc)) return 'location';
    if (st.lastEv.has(parsed.id)) return 'pallet';
    return 'unknown';
  }

  /* ---------- regulile operațiunilor ---------- */
  function locTxt(wh, loc) { return wh + ' / ' + (loc || 'fără locație'); }
  /* Locațiile de parter (mai mulți paleți pe locație) se recunosc după terminația codului, pe depozit: rules = { Orkla: '-0', Douglas: '1' }. */
  function isGround(rules, wh, loc) {
    var sfx = rules && rules[wh];
    return !!(sfx && loc && loc !== LOST && loc.length > sfx.length && loc.slice(-sfx.length) === sfx);
  }
  function planPlace(st, wh, pid, loc, mode, ground) {
    var cur = st.stock.get(pid);
    if (cur && cur.wh === wh && cur.loc === loc) return { status: 'noop', msg: 'Paletul este deja pe locația ' + loc + '.' };
    var occ = occupants(st, wh, loc).filter(function (x) { return x !== pid; });
    var q = [], evs = [];
    if (ground && occ.length) { // parter: paleții existenți se confirmă prin scanare, nu sunt dați la o parte
      var evg = { type: cur ? 'MOVE' : 'IN', p: pid, wh: wh, loc: loc };
      if (cur) { evg.fromWh = cur.wh; evg.fromLoc = cur.loc; }
      if (mode === 'IN' && cur) q.push('Paletul figurează deja în stoc la ' + locTxt(cur.wh, cur.loc) + '. Îl muți la ' + locTxt(wh, loc) + '?');
      if (mode === 'MOVE' && !cur) q.push('Paletul nu figurează în stoc. Îl înregistrezi ca intrare la ' + locTxt(wh, loc) + '?');
      if (mode === 'MOVE' && cur && cur.wh !== wh) q.push('Paletul figurează în ' + cur.wh + '. Îl transferi în ' + locTxt(wh, loc) + '?');
      return { status: 'verify', questions: q, events: [evg], occupants: occ, loc: loc, wh: wh };
    }
    if (mode === 'IN' && cur) q.push('Paletul figurează deja în stoc la ' + locTxt(cur.wh, cur.loc) + '. Îl muți la ' + locTxt(wh, loc) + '?');
    if (mode === 'MOVE' && !cur) q.push('Paletul nu figurează în stoc. Îl înregistrezi ca intrare la ' + locTxt(wh, loc) + '?');
    if (mode === 'MOVE' && cur && cur.wh !== wh) q.push('Paletul figurează în ' + cur.wh + '. Îl transferi în ' + locTxt(wh, loc) + '?');
    if (occ.length) q.push('Locația ' + loc + ' este ocupată de paletul ' + occ.join(', ') + '. Dacă continui, acel palet rămâne în stoc fără locație.');
    occ.forEach(function (o) { evs.push({ type: 'UNLOC', p: o, wh: wh, loc: loc, note: 'Locație preluată de ' + pid }); });
    var ev = { type: cur ? 'MOVE' : 'IN', p: pid, wh: wh, loc: loc };
    if (cur) { ev.fromWh = cur.wh; ev.fromLoc = cur.loc; }
    evs.push(ev);
    return { status: q.length ? 'confirm' : 'ok', questions: q, events: evs };
  }
  /* După confirmare: lost = paleții marcați lipsă → merg pe locația LOST; apoi mișcarea paletului nou. */
  function verifyEvents(plan, lost) {
    var evs = [];
    (lost || []).forEach(function (p) { evs.push({ type: 'MOVE', p: p, wh: plan.wh, loc: LOST, fromWh: plan.wh, fromLoc: plan.loc, note: 'Lipsă la confirmare pe ' + plan.loc }); });
    return evs.concat(plan.events);
  }
  function planOut(st, wh, pid, dest) {
    var cur = st.stock.get(pid);
    if (!cur) {
      var le = st.lastEv.get(pid);
      if (le && le.type === 'OUT') return { status: 'error', msg: 'Paletul a ieșit deja din stoc (' + fmtDT(le.ts) + ').' };
      return { status: 'confirm', questions: ['Paletul nu figurează în stoc. Înregistrezi ieșirea oricum?'], events: [{ type: 'OUT', p: pid, wh: wh, loc: '', dest: dest }] };
    }
    var ev = { type: 'OUT', p: pid, wh: cur.wh, loc: cur.loc, dest: dest };
    if (cur.wh !== wh) return { status: 'confirm', questions: ['Paletul figurează în ' + cur.wh + ', nu în ' + wh + '. Înregistrezi ieșirea?'], events: [ev] };
    return { status: 'ok', events: [ev] };
  }
  function attach(plan, parsed) { // pune codul brut și datele GS1 pe mișcarea paletului scanat
    if (!plan.events || !parsed) return plan;
    var main = plan.events[plan.events.length - 1];
    if (parsed.raw && parsed.raw !== main.p) main.raw = parsed.raw;
    if (parsed.gs1) main.gs1 = parsed.gs1;
    return plan;
  }

  /* Un pas de scanare. slots = {P:{id,cls,parsed}|null, L:string|null}.
     Întoarce {slots, out}, unde out.kind ∈ need | plan | error | info. */
  function scanFlow(mode, slots, st, wh, dest, parsed, groundFn) {
    var cls = classify(st, parsed);
    var P = slots && slots.P || null, L = slots && slots.L || null;
    var mk = function (c) { return { id: parsed.id, cls: c, parsed: parsed }; };
    var occ, plan;

    if (window.XLSX) return Promise.resolve(window.XLSX);

      var s = document.createElement('script');

  }
  function saveFile(filename, data, mime) {
    var useClaude = window.claude && typeof window.claude.use === 'function';
    var direct = function () {
      var blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
      var a = document.createElement('a'), url = URL.createObjectURL(blob);
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
      return true;
    };
    if (!useClaude) return Promise.resolve(direct());
    return window.claude.use('downloads').then(function (dl) {
      if (!dl) { toast('Salvarea fișierelor nu este disponibilă în această previzualizare.'); return false; }
      return dl.save({ filename: filename, data: data }).then(function () { return true; });
    }).catch(function (e) {
      if (!e || e.code !== 'declined') toast('Fișierul nu a putut fi salvat' + (e && e.message ? ': ' + e.message : '.'));
      return false;
    });
  }
  function sheetFromAOA(X, aoa) {
    var ws = {}, widths = [], nc = 0;
    aoa.forEach(function (row, r) {
      if (row.length > nc) nc = row.length;
      row.forEach(function (v, c) {
        var cell, len;
        if (v && typeof v === 'object' && v.d != null) { cell = { t: 'n', v: C.excelSerial(Math.floor(v.d / 1000) * 1000), z: 'dd.mm.yyyy hh:mm:ss' }; len = 19; }
        else if (typeof v === 'number') { cell = { t: 'n', v: v }; len = String(v).length; }
        else { v = v == null ? '' : String(v); if (v === '') return; cell = { t: 's', v: v }; len = v.length; }
        ws[X.utils.encode_cell({ r: r, c: c })] = cell;
        if (!widths[c] || widths[c] < len) widths[c] = len;
      });
    });
    ws['!ref'] = X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(0, aoa.length - 1), c: Math.max(0, nc - 1) } });
    ws['!cols'] = []; for (var i = 0; i < nc; i++) ws['!cols'].push({ wch: Math.min(48, Math.max(9, (widths[i] || 6) + 2)) });
    if (aoa.length > 1) ws['!autofilter'] = { ref: ws['!ref'] };
    return ws;
  }
  function exportTable(base, sheets, fmt) {
    var name = base + '-' + C.stamp(Date.now());
    if (fmt === 'csv') return saveFile(name + '.csv', C.toCSV(sheets[0].aoa), 'text/csv;charset=utf-8');
    return loadXLSX().then(function (X) {
      var wb = X.utils.book_new();
      sheets.forEach(function (s) { X.utils.book_append_sheet(wb, sheetFromAOA(X, s.aoa), s.name); });
      var out = X.write(wb, { bookType: 'xlsx', type: 'array' });
      return saveFile(name + '.xlsx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    }).catch(function (e) { toast(e.message || String(e)); return false; });
  }
  function readBuf(file) {
    return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.onerror = function () { rej(new Error('Fișierul nu a putut fi citit.')); }; fr.readAsArrayBuffer(file); });
  }
  function decodeText(buf) {

        var wb = X.read(new Uint8Array(buf), { type: 'array' }), name = null, ws = null;
        wb.SheetNames.some(function (n) { if (wb.Sheets[n] && wb.Sheets[n]['!ref']) { name = n; ws = wb.Sheets[n]; return true; } return false; });
        if (!ws) throw new Error('Fișierul nu conține date.');
        var rg = X.utils.decode_range(ws['!ref']), rows = [];

        for (var r = rg.s.r; r <= rg.e.r; r++) {
          var row = [];
          for (var c = rg.s.c; c <= Math.min(rg.e.c, rg.s.c + 60); c++) {
            var cell = ws[X.utils.encode_cell({ r: r, c: c })];
            row.push(!cell ? '' : (cell.t === 's' || cell.t === 'str') ? String(cell.v) : { t: cell.t, v: cell.v, w: cell.w });
          }
          rows.push(row);
        }
        return { rows: rows, sheet: name };
      });
    });
  }

  function syncIn(files) {
    var have = new Set(S.byId.keys()), fresh = [], dup = 0, bad = 0, badFiles = [], newWh = 0, newLoc = 0;
    var haveLoc = {}; S.locs.forEach(function (l) { haveLoc[C.lkey(l.wh, l.loc)] = 1; });
    var chain = Promise.resolve();
    Array.prototype.forEach.call(files, function (f) {
      chain = chain.then(function () { return readBuf(f); }).then(function (buf) {
        var data;
        try { data = JSON.parse(decodeText(buf)); } catch (e) { data = null; }
        if (!data || data.app !== 'stoc-paleti' || !Array.isArray(data.events)) { badFiles.push(f.name); return; }
        var m = C.mergeEvents(have, data.events);
        m.fresh.forEach(function (e) { have.add(e.id); fresh.push(C.cleanForUpload(e)); });
        dup += m.dup; bad += m.bad;
        (data.warehouses || []).forEach(function (w) { if (typeof w === 'string' && w && cfg.warehouses.indexOf(w) < 0) { cfg.warehouses.push(w); newWh++; } });
        (data.dests || []).forEach(function (d) { if (typeof d === 'string' && d && cfg.dests.indexOf(d) < 0) cfg.dests.push(d); });
        (data.locs || []).forEach(function (l) { if (l && l.wh && l.loc && !haveLoc[C.lkey(l.wh, l.loc)]) { haveLoc[C.lkey(l.wh, l.loc)] = 1; S.locs.push({ wh: l.wh, loc: l.loc }); newLoc++; } });
      });
    });
    chain.then(function () { return fresh.length ? Store.put(fresh) : null; })
      .then(function () { return Promise.all([saveCfg(), Store.setMeta('locs', S.locs)]); })
      .then(function () {
        fresh.forEach(function (e) { S.events.push(e); });
        rebuild(); notifyTabs(); renderTab(); scheduleFlush(0); pushMeta();
        openDlg('<h2>Date încărcate</h2><p><b>' + plural(fresh.length, 'mișcare nouă', 'mișcări noi') + '</b> adăugate. ' + dup + ' existau deja și au fost sărite.' + (bad ? ' ' + bad + ' înregistrări invalide au fost ignorate.' : '') + '</p>' +

          '<div class="foot"><button type="button" class="btn pri" data-act="dlg-x">Am înțeles</button></div>');

  function sscc(n) {
    var b = '3594000' + C.pad(100000000 + n, 10), sum = 0;
    for (var i = 0; i < 17; i++) sum += (+b.charAt(i)) * (i % 2 === 0 ? 3 : 1);
    return b + ((10 - sum % 10) % 10);
  }
  function demoAdd() {
    var now = Date.now(), H = 3600000, evs = [], n = 0, locs = [];
    var mk = function (o, ago) { o.id = 'demo-' + C.pad(++n, 4); o.ts = now - Math.round(ago * H) + n; o.src = 'demo'; o.dev = 'Demo'; evs.push(o); };
    var r, c;
    for (r = 1; r <= 4; r++) for (c = 1; c <= 5; c++) locs.push({ wh: 'Orkla', loc: 'A-' + C.pad(r) + '-' + C.pad(c), demo: true });
    for (r = 1; r <= 3; r++) for (c = 1; c <= 5; c++) locs.push({ wh: 'Douglas', loc: 'D-' + C.pad(r) + '-' + C.pad(c), demo: true });
    for (var i = 0; i < 15; i++) mk({ type: 'IN', p: sscc(i + 1), wh: 'Orkla', loc: locs[i].loc }, 70 - i * 3.1);
    for (i = 0; i < 9; i++) mk({ type: 'IN', p: sscc(i + 41), wh: 'Douglas', loc: locs[20 + i].loc }, 52 - i * 4.3);
    mk({ type: 'MOVE', p: sscc(3), wh: 'Orkla', loc: 'A-04-01', fromWh: 'Orkla', fromLoc: 'A-01-03' }, 20);
    mk({ type: 'MOVE', p: sscc(44), wh: 'Douglas', loc: 'D-03-02', fromWh: 'Douglas', fromLoc: 'D-01-04' }, 9);
    mk({ type: 'OUT', p: sscc(1), wh: 'Orkla', loc: 'A-01-01', dest: 'TC' }, 6);
    mk({ type: 'OUT', p: sscc(2), wh: 'Orkla', loc: 'A-01-02', dest: 'TC' }, 5.9);
    mk({ type: 'OUT', p: sscc(41), wh: 'Douglas', loc: 'D-01-01', dest: 'TC' }, 3);
    mk({ type: 'IN', p: sscc(16), wh: 'Orkla', loc: 'A-01-01' }, 1.5);
    mk({ type: 'IN', p: sscc(50), wh: 'Douglas', loc: 'D-01-01' }, 0.6);
    cfg.warehouses.indexOf('Orkla') < 0 && cfg.warehouses.push('Orkla');
    cfg.warehouses.indexOf('Douglas') < 0 && cfg.warehouses.push('Douglas');
    S.locs = S.locs.concat(locs);
    return Store.put(evs).then(function () { return Store.setMeta('locs', S.locs); }).then(function () {
      evs.forEach(function (e) { S.events.push(e); });
      rebuild(); saveCfg();
    });
  }

    var ids = {}, pal = {}, del = [];
    S.events.forEach(function (e) { if (e.src === 'demo') { ids[e.id] = 1; pal[e.p] = 1; } });
    S.events.forEach(function (e) { if (ids[e.id] || (e.p && pal[e.p]) || (e.ref && ids[e.ref])) del.push(e.id); });

  function bind() {
    document.addEventListener('click', function (ev) {
      var t = ev.target, el = t.closest ? t.closest('[data-act],[data-tab],[data-mode]') : null;
      if (el) {
        if (el.hasAttribute('data-act')) { var f = A[el.getAttribute('data-act')]; if (f) f(el, ev); }
        else if (el.hasAttribute('data-tab')) showTab(el.getAttribute('data-tab'));
        else if (el.hasAttribute('data-mode')) {
          ui.mode = cfg.mode = el.getAttribute('data-mode'); ui.slots = null; ui.pending = null; ui.verify = null; ui.order = null; ui.result = null; ui.note = '';
          saveCfg(); renderScan();
        }
      }
      setTimeout(focusScan, 0);
    });
    $('scanForm').addEventListener('submit', function (ev) { ev.preventDefault(); submitScan(); });
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Tab' && inp.value) { ev.preventDefault(); submitScan(); } });
    inp.addEventListener('input', function () {
      var now = Date.now(), len = inp.value.length, delta = len - burst.len, dt = now - burst.last;
      clearTimeout(burst.timer);
      if (/[\r\n]/.test(inp.value)) { submitScan(); return; }
      if (len === 0) burst.fast = 0;
      else if (delta >= 3) burst.fast = 99;            // cod venit dintr-o bucată (scanner sau lipire)
      else if (delta >= 1 && dt < 50) burst.fast += delta; // caractere foarte rapide = scanner
      else if (delta >= 1) burst.fast = 0;
      burst.len = len; burst.last = now;
      if (cfg.auto && burst.fast >= 4 && len >= 3) burst.timer = setTimeout(submitScan, 260);
    });
    inp.addEventListener('blur', function () { setTimeout(focusScan, 150); });
    document.addEventListener('keydown', function (ev) {
      if (ui.tab !== 'scan' || !$('dlg').hidden) return;
      var a = document.activeElement;
      if (a === inp || (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))) return;
      if (ev.key && (ev.key.length === 1 || ev.key === 'Unidentified') && !ev.ctrlKey && !ev.metaKey && !ev.altKey) focusScan();
    });
    window.addEventListener('focus', focusScan);
    var wasNarrow = narrow(), rz = null;
    window.addEventListener('resize', function () {
      clearTimeout(rz);
      rz = setTimeout(function () { if (narrow() !== wasNarrow) { wasNarrow = narrow(); if (ui.tab === 'stock') renderStockBody(); else if (ui.tab === 'moves') renderMovesBody(); } }, 200);
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { renderChrome(); focusScan(); } });

    var filt = function (ev) {
      var el = ev.target, f = el.getAttribute && el.getAttribute('data-f'), s = el.getAttribute && el.getAttribute('data-s');
      if (f) {
        var parts = f.split('.'), o = parts[0] === 'fs' ? fs : fm;
        o[parts[1]] = el.value; o.limit = 300;
        if (parts[0] === 'fs' && parts[1] === 'wh') renderStock();
        else if (parts[0] === 'fs') renderStockBody(); else renderMovesBody();
      } else if (s) {
        if (el.type === 'checkbox') cfg[s] = el.checked;
        else if (el.type === 'radio') { if (el.checked) cfg[s] = el.value; }
        else cfg[s] = s === 'devName' ? el.value.trim() : el.value;
        if (s === 'wh') { cfg.setup = true; ui.slots = null; ui.pending = null; ui.result = null; ui.whSeen = cfg.wh; followWh(); ordersListen(); }
        if (s === 'devName') deviceAnnounce();
        saveCfg(); renderChrome();
        if (ev.type === 'change' && (s === 'wh' || s === 'dest')) renderSettings();
